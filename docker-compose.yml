# Local development stack: the gateway API and PostgreSQL.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: toolgate
      POSTGRES_USER: toolgate
      POSTGRES_PASSWORD: toolgate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolgate -d toolgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ToolGate: "Host=postgres;Port=5432;Database=toolgate;Username=toolgate;Password=toolgate"
      Database__Provider: PostgreSQL
      Database__EnsureCreated: "true"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
